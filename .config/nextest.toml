# Added 2026-08-01 by roadmap unit P13, REMOVED from this list 2026-09-06 by GitHub issue
# #74 — it now runs in the dev loop at 2.12 s, having been the single most expensive test in
# the suite at 35.99 s. Nothing about the test changed; `antenna-core` is compiled optimized
# (Cargo.toml), so the ~3 x 65,537 radial samples it must evaluate cost what they cost in a
# release build. The entry is kept because what it says about the test is still true:
#   mode_path_reports_a_radial_error_even_when_the_density_cap_binds  ~1.9 s release, ~35 s
#     unoptimized debug — it pins that the mode path still reports a radial error estimate when
#     radial_points_for clamps to RADIAL_POINTS_SAFETY_MAX, so it must actually reach that cap:
#     ~3 × 65 537 radial samples, which is what "the cap binds" MEANS. Genuinely slow by
#     construction — unlike test_heavy_heatmap_times_out_with_504, which was filed in this same
#     class and turned out not to belong to it (see above), the cost here IS the thing asserted:
#     the test's subject is what happens when the sample cap binds, so it must reach the cap.
#     Shrinking the dish does not help, because the cost is set by the cap, not by D/λ.
#     Kept 2026-09-06 by GitHub issue #72, which added nine scripted default-tier companions
#     (`refinement_*`, `mode_path_result_*`, `radial_check_points_ceilings_*`, 0.019 s for all
#     nine) driving the same `refine_radial` / `mode_path_result` control through an injected
#     density limit — including one at the real RADIAL_POINTS_SAFETY_MAX. They do NOT replace
#     this entry: none of them evaluates an aperture sample, so only this test can show the
#     real 65 537-point cap is reachable by a real geometry and that the capped legs
#     genuinely disagree. See docs/findings-2026-09-06-issue-72-radial-cap-control-seam.md.
# Re-measured 2026-08-17 by roadmap D18 task 3 — both full-mode e2e binaries stay excluded,
# but they cost well under half what they did. `calibrate`'s two per-measurement-point physics
# sweeps (the tuner's Nelder-Mead objective and `main.rs::compute_model_predictions`) were
# serial; they are now parallel over points, and D31 stopped the tuner re-sweeping the initial
# vector that argmin evaluates anyway as simplex vertex 0. `cli_full_mode_e2e` went
# **504 s -> 217 s**, the whole package 510.6 s -> 235.7 s, with no assertion touched and every
# artifact byte unchanged bar its timestamp and CRC.
#
# Re-measured 2026-09-05 for GitHub issue #67 after warming the build, using Rust's debug
# `test` profile (`unoptimized + debuginfo`) and nextest's `full` profile at one test thread:
#
#   cargo nextest run -p calibrate --profile full --test cli_full_mode_e2e --test-threads 1
#
# Before: 13 tests, 230.805 s nextest summary / 232.18 s real / 1592.58 s user.
# After:  12 tests, 140.271 s nextest summary / 142.09 s real /  941.23 s user.
#
# The removed 88.608 s test ran three complete 1,728-row calibrations but asserted only
# copied metadata and artifact loadability. Its replacement parses the real Clap arguments
# through the production tuning-options boundary in milliseconds; the five-point optimizer
# test still executes N = 1, 2 and 3 with mode-specific result assertions, and the remaining
# 59.153 s full-CLI known-answer test still loads the artifact and recovers 2.6 mm surface RMS.
# This removes 39% of this binary's sequential wall time without moving either behavioral pin.
#
# Re-measured 2026-09-05 for GitHub issue #68 with the same warmed debug build, nextest full
# profile, and one-test-thread command shown above:
#
# Before: 12 tests, 140.271 s nextest summary / 142.09 s real / 941.23 s user.
# After:   7 tests, 103.605 s nextest summary / 104.03 s real / 618.86 s user.
#
# Setup accounting is explicit: before, the binary performed 10 real 1,728-row grid
# generations and 7 full CLI calibrations (four duplicate untuned runs, K=3 plus K=6, and one
# tuned run). After, it performs 5 grid generations and 3 CLI calibrations: determinism still
# generates twice, while the untuned, validated K=3, and tuned scenarios each own one grid and
# one CLI run. Named helpers apply the preserved grid, artifact/service-loader, corrected-
# physics, asymmetry, RMSE, four off-grid probes, and no-validation assertions to the single
# immutable untuned result. K=6 moved to cheap Clap-to-production-options coverage beside K=3;
# the real K=3 report still proves every fold score is finite. That removes another 26% of
# sequential wall time without weakening a behavioral boundary.
#
# Re-measured 2026-09-05 for GitHub issue #69 with the same warmed debug build, nextest
# `full` profile, and one-test-thread command shown above:
#
# Before: 7 tests, 103.605 s nextest summary / 104.03 s real / 618.86 s user.
# After:  8 tests,  80.755 s nextest summary /  81.12 s real / 572.28 s user.
#
# The three real CLI scenarios and their full-grid premises are unchanged. Full-grid setup
# fell from five generations to three: the two uncached determinism calls now exercise the
# same ordered parallel generator on a heterogeneous 12-point grid, while the shared untuned
# scenario owns the complete-grid dimensions/order, deep-sidelobe, and CLI measurement-count
# assertions. The new constants-only fitter-capacity check derives knot counts and spacing
# from `CorrectionSurfaceParams::shipped()` without computing gains. The binary's sequential
# wall time fell another 22% even though it gained one test.
#
# Default-tier verification used the same warmed build and one test thread:
#
#   cargo nextest run -p calibrate --profile default --test cli_full_mode_e2e --test-threads 1
#
# Before: 0 tests from this binary (whole-binary exclusion).
# After:  5 tests in 0.112 s nextest summary / 0.51 s real / 0.67 s user.
#
# Each rewritten check is individually under 0.1 s, well inside the 10 s fast-tier
# policy. The three 10.080–57.807 s CLI scenarios remain excluded by name from `default` and
# all eight tests remain selected by `profile.full`.
#
# Re-measured 2026-09-05 for GitHub issue #70 with a warmed debug build and the same nextest
# runner on both sides:
#
#   cargo nextest run -p calibrate --profile full \
#     --test cli_full_mode_real_data_e2e --test-threads 1
#
# Before: 14 tests, 23.419 s nextest summary / 24.59 s real / 54.62 s user.
# After:   2 tests,  7.615 s nextest summary /  7.98 s real / 11.55 s user.
#
# Under nextest, the old process-local `OnceLock` was instantiated once per test process: 14
# real-grid generations and 15 CLI calibrations (the validated test ran both variants). The
# consolidated scenario performs one 3,240-row generation, one unvalidated CLI calibration
# consumed by every reconstruction/service assertion, and one directly requested validated
# CLI calibration. It retains all 19 peak-envelope comparisons, five finite CV-fold scores,
# source/generator pins, loadability/metadata, corrected RMSE, residual, boresight, feed-focus,
# calibrated spillover, and angular-resolution checks. The standalone geometry guard invokes
# the production serving transform directly and runs in 0.011 s. No comparison is made to the
# historical 7.77 s serial-libtest figure: that is a different runner and cannot establish a
# speedup.
#
# Default-tier verification used that same direct geometry test:
#
#   cargo nextest run -p calibrate --profile default \
#     --test cli_full_mode_real_data_e2e request_geometry_lands_on_the_requested_angles
#
# Before: 0 tests (whole-binary exclusion). After: 1 test in 0.009 s; the 7.6 s consolidated
# scenario remains excluded by exact name and selected by `profile.full`.
#
# Two things to know before quoting or re-measuring any figure in this file.
#
# 1. **Say whether a figure is standalone, sequential, or from a concurrent full run.** The
#    historical D18 figures differ by ~4x because the scheduler, not the code, made fixture
#    generation ~4.8 s standalone and ~18 s with thirteen test processes competing. The
#    issue #67/#68 figures avoid that ambiguity by using `--test-threads 1`. An earlier D18
#    closeout compared a standalone "after" against a contended "before" and reported a 3x
#    improvement that was really 1.8x.
#
# 2. **The change trades CPU for wall, by an amount that depends on the core count.** One
#    tuned run (`--tuning-mode all`, 1 iteration), real/user: 1 thread 152.3/151.9 s, 2
#    threads 77.6/154.3, 4 threads 42.5/162.9, 8 threads 36.4/223.5. The overhead is ~0 at 1
#    thread (the refactor itself costs nothing), +1.6% at 2 and +7.3% at 4 — the range CI's
#    `ubuntu-latest` runners live in — and only blows out to +47% at 8, which is the reference
#    laptop's 4 performance + 4 efficiency cores, where rayon's last four workers are
#    stragglers the pool waits on. Rayon's pool is deliberately NOT capped: a cap would be a
#    fitted constant with nothing asserting its margin, which is what P13 retired one for, and
#    the runner with the hard budget is the one where the overhead is ~2%.
#
#    **Confirmed on the real runner** (PR #49, 2026-08-18): the `clippy + test` job came in at
#    11m01s against 15m13s and 18m26s for the two preceding main runs, so a 2-4 core runner
#    gains wall time here rather than losing it — which is what the curve above predicts and
#    what the +47% figure would have contradicted had it applied there. Treat that as a
#    direction, not a speedup figure: the two baseline runs differ from each other by three
#    minutes, so job-level noise is wide and these times include build and cache variance.
#
# **Asked and answered: does this threaten the wall-clock assertions elsewhere in the suite?**
# Raised on review — under `--profile full` these binaries are scheduled alongside
# `resilience_tests::test_no_resource_leaks_after_errors` and
# `test_health_endpoint_always_responsive`, which assert a `/health` round trip under 100 ms
# with no `threads-required` reservation, and each calibrate test now saturates from two places
# at once (in-process `generate_grid`, plus the `calibrate` subprocess it spawns). Measured
# 2026-08-17 rather than argued: both tests were run four times *while* the full
# `cli_full_mode_e2e` binary was loading all eight cores, and passed every time with the entire
# test taking 0.19-0.21 s and 0.76-0.90 s — the round trip being a small fraction of that,
# against a 100 ms budget. `/health` does no compute, so it is scheduler-latency bound, not
# CPU bound. No reservation was added: there is no measurement supporting one, and reserving
# the machine for a 217 s test would cost far more than it could buy. If these ever do flake,
# start here — the measurement above is the baseline to compare against.
#
# Updated 2026-09-05 for GitHub issue #69: only the untuned, K=3 validation, and tuned
# synthetic scenarios remain excluded. They take 11–67 s each in the sequential #68
# measurement above, so they stay CI-blocking in `profile.full`; the five cheap fixture
# checks in the same binary now run in the default developer tier.
#
# Updated 2026-09-05 for GitHub issue #70: D14's whole-binary exclusion is narrowed to the
# single consolidated scenario below. Its one generation plus unvalidated and validated CLI
# calibrations remain slow-tier work; `request_geometry_lands_on_the_requested_angles` now
# calls the production coordinate transform directly and rejoins the default developer tier.
#
# Updated 2026-09-05 for GitHub issue #71: `p12_mode_path_radial_convergence_anchors` rejoins
# the default tier after falling to 0.09 s. The phi-cap regression remains excluded and all
# retained numerical contracts continue to run in profile.full.
default-filter = """
not (
    (binary_id(calibrate::cli_full_mode_e2e) & test(cli_untuned_scenario_preserves_artifact_correction_and_no_validation))
  + (binary_id(calibrate::cli_full_mode_e2e) & test(cli_cv_three_folds_reports_finite_scores))
  + (binary_id(calibrate::cli_full_mode_e2e) & test(cli_tuned_run_recovers_the_surface_rms_perturbation))
  + (binary_id(calibrate::cli_full_mode_real_data_e2e) & test(real_data_scenario_preserves_generator_cli_artifact_and_service_contract))
)
"""

# The `threads-required = "num-test-threads"` reservation on `test(test_sustained_load)` was
# deleted from BOTH profiles 2026-09-06 by GitHub issue #73, together with the test it guarded.
# It existed because that test's assertions were rates: three workers issuing gain requests
# across a fixed 2 s window, with a floor on how many they got through. A rate is a function of
# how much of the machine the test gets, so the only way to stabilise it was to give it the
# whole machine — and even then it had flaked twice (`> 50` -> `>= 15` after a 47, then `>= 15`
# -> `>= 6` after CI run 30715580598 returned 9 attempts with every request a 2xx).
#
# Its replacement, `test_repeated_concurrent_gain_requests`, asserts the property that was
# actually wanted — three concurrently started workers each completing two sequential real gain
# requests, every response checked for status and body correctness, hangs bounded by a 120 s
# failure timeout — and contains no wall-clock window, pacing sleep, request-count floor or
# latency threshold. Nothing in it depends on the scheduler, so nothing is bought by reserving
# threads for it. Verified before removal: the eight-test `concurrent_tests` group, run three
# times each at `--test-threads` 1, 2 and 8, passed 9/9 (4.07 s / 2.83 s / 2.55 s), and the test
# also passed under a full `--workspace` run scheduled alongside every other binary.
#
# Measured 2026-09-06 on a warmed debug build, same runner settings on both sides.
#
#   Standalone: cargo nextest run -p antenna-model --test integration <name> --test-threads 1
#     Before (test_sustained_load):                     2.291 / 2.265 / 2.257 s
#     After  (test_repeated_concurrent_gain_requests):  0.311 / 0.311 / 0.309 s
#
#   Default tier: cargo nextest run --workspace
#     Before: 23.939 / 23.408 / 23.262 s nextest summary, at 360 / 545 / 585% CPU
#     After:  19.805 / 19.702 / 19.815 s nextest summary, at 603 / 676 / 672% CPU
#
# Both sides run all 1116 tests. Roughly 1.9 s of the ~3.5 s saved is the test itself no longer
# spending 2 s in a wall-clock window; the rest is the whole-machine reservation no longer
# draining every other slot around it — which is also why CPU utilisation rises. No clock is
# paused anywhere: the workers do real HTTP round trips against a real server, as before.
#
# Throughput and soak measurement is not homeless, it just does not live here: it needs a
# release build on a controlled machine, driven from outside the process. That is the k6
# harness in `tests/load/load_test_scenarios.js`, which drives real arrival rates against a
# running service (`normal` = 10 req/s for 5 min, `peak` = 20 req/s for 1 min) — the thing the
# deleted 2 s window was imitating — with `cargo bench` covering the aperture-integration hot
# path underneath it.

# Re-measured 2026-09-06 for GitHub issue #74, warmed build, `--profile full
# --ignore-default-filter --test-threads 1`, with antenna-core compiled at opt-level 3:
#
#   cli_untuned_scenario_preserves_artifact_correction_and_no_validation      1.06 s
#   cli_cv_three_folds_reports_finite_scores                                  3.78 s
#   cli_tuned_run_recovers_the_surface_rms_perturbation                       3.96 s  (85.9 s)
#   real_data_scenario_preserves_generator_cli_artifact_and_service_contract  6.43 s  (7.6 s)
#
# Those are sequential figures. In a concurrent `--profile full` run on the same machine the
# same four report 2.99, 6.70, 6.21 and 9.61 s — the real-data scenario sitting right on the
# 10 s policy line, which is the D18 measurement caveat about standalone vs contended figures
# playing out again. So they are under the line, but not clearly under it, and by the D18 rule
# they qualify to rejoin the dev loop — and if they do, `default` and `full` select the same
# 1122 tests and the two-tier split has nothing left to do. That is a D18-level decision about
# the tier system rather than a consequence of issue #74, whose subject was the numerical
# regressions, so the four stay excluded here and the decision is left to be taken
# deliberately. The figures are recorded so it can be taken on measurements rather than on
# the pre-#74 ones above, which were taken against an unoptimized core and are 3-20x too high
# for today's build.

[profile.full]
default-filter = "all()"
slow-timeout = { period = "60s" }

# The `threads-required = 4` reservation for test(test_feed_steering_large_offset) was deleted
# 2026-08-01 by P10-perf, exactly as its own comment anticipated ("safe to delete along with
# the override when P10-perf brings the cost down"). It existed because that ~5°-steer geometry
# was the suite's most oversubscription-sensitive test — 27.6 s idle, 35.0 s contended. It now
# runs in 4.0 s against a 300 s budget, so reserving slots for it costs parallelism and buys
# nothing.

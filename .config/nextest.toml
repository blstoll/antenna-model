# Test tiers — roadmap unit D18 (filed 2026-08-01).
#
#   default = the dev inner loop. Excludes the slow tail: two heavy physics
#             pins, three expensive synthetic full-mode scenarios, and the
#             consolidated real-data scenario. Measured
#             2026-08-01 after P10-perf: 980 tests, 85.9 s wall (was 963 tests
#             / 72.8 s when the exclusion list held nine physics pins — P10-perf
#             returned six of them, so the loop covers 17 more tests for 13 s).
#             The cheap synthetic-fixture checks rejoined this profile under #69;
#             any new test over 10 s must be named below after it is measured.
#   full    = everything. scripts/check.sh and CI run this profile, so the
#             slow tier stays CI-blocking: coverage moves out of the inner
#             loop, it is never lost.
#
# The tier list shrank on 2026-09-06 (GitHub issue #74) for a reason that has nothing
# to do with the tests: `antenna-core` is now compiled at opt-level 3 in the debug and
# test builds (see [profile.dev.package.antenna-core] in Cargo.toml), and these tests
# are aperture-integration bound. The whole `full` suite went 110.5 s -> 17.7 s wall and
# 770.7 s -> 81.3 s CPU, and BOTH remaining physics pins fell under the 10 s policy line
# and rejoined the dev loop. Every figure below that predates that date was measured
# against an unoptimized core; do not compare across it without saying so.
#
# Policy (see the D18 unit in docs/roadmap-2026-07-work-units.md): a new test
# that costs > 10 s either gets faster or is added to the exclusion list below.
# The default profile marks such tests SLOW at 10 s so they surface at review
# time, not when the suite is back at 8 minutes. The list is a name snapshot:
# a renamed test silently rejoins the dev loop (slower, never less covered).
#
# To run one excluded test by name, use the full profile:
#   cargo nextest run --profile full <test_name>
# (a bare `cargo nextest run <test_name>` still applies the default filter and
# will report 0 tests run).

[profile.default]
# Surface new slow tests early; does not terminate anything.
slow-timeout = { period = "10s" }

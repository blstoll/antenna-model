# Test tiers — roadmap unit D18 (filed 2026-08-01).
#
#   default = the dev inner loop. Excludes the slow tail: three heavy physics
#             pins and both whole calibrate full-mode e2e binaries (the second,
#             cli_full_mode_real_data_e2e, was added by D14). Measured
#             2026-08-01 after P10-perf: 980 tests, 85.9 s wall (was 963 tests
#             / 72.8 s when the exclusion list held nine physics pins — P10-perf
#             returned six of them, so the loop covers 17 more tests for 13 s).
#             Excluding cli_full_mode_e2e whole-binary rather than naming its
#             slow members keeps new e2e cases out of the inner loop by default.
#   full    = everything. scripts/check.sh and CI run this profile, so the
#             slow tier stays CI-blocking: coverage moves out of the inner
#             loop, it is never lost.
#
# Policy (see the D18 unit in docs/roadmap-2026-07-work-units.md): a new test
# that costs > 10 s either gets faster or is added to the exclusion list below.
# The default profile marks such tests SLOW at 10 s so they surface at review
# time, not when the suite is back at 8 minutes. The list is a name snapshot:
# a renamed test silently rejoins the dev loop (slower, never less covered).
#
# To run one excluded test by name, use the full profile:
#   cargo nextest run --profile full <test_name>
# (a bare `cargo nextest run <test_name>` still applies the default filter and
# will report 0 tests run).

[profile.default]
# Surface new slow tests early; does not terminate anything.
slow-timeout = { period = "10s" }
# Shrunk 2026-08-01 by roadmap unit P10-perf, which is the direction this list is meant to
# move: the FFT φ' transform and the single-sweep Jₘ ladder made the mode path 2.4–7.4× cheaper,
# so seven of the nine physics tests here dropped back under the 10 s line and REJOIN the dev
# loop. Measured after P10-perf (debug, sequential):
#   test_feed_steering_large_offset                          22.3 s -> 4.0 s
#   azimuthal_modes_match_2d_small_dish_with_offset                 -> 4.5 s
#   served_n_phi_sizing_is_sufficient_on_every_asymmetric_geometry  -> 3.1 s
#   dsn34m_offset_feed_mode_count_converges                         -> 1.8 s
#   p2_moderate_offset_exact_only_gain_pinned_and_routes_standard_po-> 1.8 s
#   test_beam_steering_from_feed_displacement                       -> 1.8 s
# The two that stay (three until 2026-08-15, when test_heavy_heatmap_times_out_with_504 left
# the tier — see the "Removed from this list" note below):
#   p12_mode_path_radial_convergence_anchors  7.3 s sequential, 9.1 s in a full run — under
#     the 10 s marker, but it became the dev loop's single longest test and therefore its
#     critical path: returning it took the loop from 72.8 s to 92.8 s, over D18's 90 s budget,
#     for one test. Held back on tail-latency grounds rather than absolute cost; it is a
#     candidate to return once D18 task 2 shrinks the integration-test class around it.
#   p12_phi_cap_removed_steered_feed_matches_converged_reference  125 s -> 15.7 s
#     (43 s under a contended full run) — it sweeps four steered angles against a converged
#     reference, so it pays the steered cost four times over.
# Removed from this list 2026-08-15 (roadmap D18):
#   test_heavy_heatmap_times_out_with_504 — REJOINS the dev loop at 1.2 s (was 16.3 s here,
#     130.9 s in a full run). Its entry claimed "it exists to exhaust S3's wall-clock budget,
#     so it is slow by construction and no speedup will change that." Both halves were wrong.
#     It exists to assert a 504 carries `request_timeout` and an `x-request-id`, which needs no
#     wall clock at all; it now runs on a paused clock in process, the way its S2b sibling
#     already did. Worth remembering as a pattern: "slow by construction" was asserted about
#     the *mechanism* when it was really a property of one *implementation* of the assertion.
# Added 2026-08-01 by roadmap unit P13:
#   mode_path_reports_a_radial_error_even_when_the_density_cap_binds  ~1.9 s release, ~35 s
#     debug — it pins that the mode path still reports a radial error estimate when
#     radial_points_for clamps to RADIAL_POINTS_SAFETY_MAX, so it must actually reach that cap:
#     ~3 × 65 537 radial samples, which is what "the cap binds" MEANS. Genuinely slow by
#     construction — unlike test_heavy_heatmap_times_out_with_504, which was filed in this same
#     class and turned out not to belong to it (see above), the cost here IS the thing asserted:
#     the test's subject is what happens when the sample cap binds, so it must reach the cap.
#     Shrinking the dish does not help, because the cost is set by the cap, not by D/λ.
# Re-measured 2026-08-17 by roadmap D18 task 3 — both full-mode e2e binaries stay excluded,
# but they cost well under half what they did. `calibrate`'s two per-measurement-point physics
# sweeps (the tuner's Nelder-Mead objective and `main.rs::compute_model_predictions`) were
# serial; they are now parallel over points, and D31 stopped the tuner re-sweeping the initial
# vector that argmin evaluates anyway as simplex vertex 0. `cli_full_mode_e2e` went
# **504 s -> 217 s**, the whole package 510.6 s -> 235.7 s, with no assertion touched and every
# artifact byte unchanged bar its timestamp and CRC.
#
# Two things to know before quoting or re-measuring any figure in this file.
#
# 1. **Say whether a figure is standalone or from a full run.** They differ by ~4x here and
#    the difference is the scheduler, not the code: the fixture generation is ~4.8 s running
#    one test at a time and ~18 s inside the binary; `cli_tuned_run_completes_for_every_
#    tuning_mode` is 86 s standalone and 217 s in the binary. An earlier draft of the D18
#    closeout compared a standalone "after" against a contended "before" and reported a 3x
#    improvement that was really 1.8x.
#
# 2. **The change trades CPU for wall, by an amount that depends on the core count.** One
#    tuned run (`--tuning-mode all`, 1 iteration), real/user: 1 thread 152.3/151.9 s, 2
#    threads 77.6/154.3, 4 threads 42.5/162.9, 8 threads 36.4/223.5. The overhead is ~0 at 1
#    thread (the refactor itself costs nothing), +1.6% at 2 and +7.3% at 4 — the range CI's
#    `ubuntu-latest` runners live in — and only blows out to +47% at 8, which is the reference
#    laptop's 4 performance + 4 efficiency cores, where rayon's last four workers are
#    stragglers the pool waits on. Rayon's pool is deliberately NOT capped: a cap would be a
#    fitted constant with nothing asserting its margin, which is what P13 retired one for, and
#    the runner with the hard budget is the one where the overhead is ~2%.
#
# **Asked and answered: does this threaten the wall-clock assertions elsewhere in the suite?**
# Raised on review — under `--profile full` these binaries are scheduled alongside
# `resilience_tests::test_no_resource_leaks_after_errors` and
# `test_health_endpoint_always_responsive`, which assert a `/health` round trip under 100 ms
# with no `threads-required` reservation, and each calibrate test now saturates from two places
# at once (in-process `generate_grid`, plus the `calibrate` subprocess it spawns). Measured
# 2026-08-17 rather than argued: both tests were run four times *while* the full
# `cli_full_mode_e2e` binary was loading all eight cores, and passed every time with the entire
# test taking 0.19-0.21 s and 0.76-0.90 s — the round trip being a small fraction of that,
# against a 100 ms budget. `/health` does no compute, so it is scheduler-latency bound, not
# CPU bound. No reservation was added: there is no measurement supporting one, and reserving
# the machine for a 217 s test would cost far more than it could buy. If these ever do flake,
# start here — the measurement above is the baseline to compare against.
#
# Added 2026-08-02 by roadmap unit D14, on review:
#   binary_id(calibrate::cli_full_mode_real_data_e2e) — the real-anchored full-mode e2e. No
#     single test crosses the 10 s marker (measured 2.6–5.4 s, 7.6 s for the binary), so the
#     per-test rule did not catch it, but the binary is process-per-test and every one of its
#     10 tests re-runs the whole pipeline: generate a 3240-row grid, then a full `calibrate`
#     run. That is ~48 s of CPU for one binary — the `OnceLock` in `pipeline()` shares the work
#     under `cargo test` and shares nothing under nextest. Excluded whole-binary for the same
#     reason `cli_full_mode_e2e` is: it keeps new e2e cases out of the inner loop by default.
default-filter = """
not (
    binary_id(calibrate::cli_full_mode_e2e)
  + binary_id(calibrate::cli_full_mode_real_data_e2e)
  + test(p12_phi_cap_removed_steered_feed_matches_converged_reference)
  + test(p12_mode_path_radial_convergence_anchors)
  + test(mode_path_reports_a_radial_error_even_when_the_density_cap_binds)
)
"""

# `test_sustained_load` is the one test in the suite that asserts **wall-clock progress of a
# live server** — three workers issuing gain requests across a 2 s window. That makes it the
# one test whose result depends on how much of the machine it gets, so it is given the machine.
#
# This is not the reservation P10-perf deleted below, restored under a new name. That one sat on
# a CPU-bound *physics* test that had simply become slow, and it went away when the test got
# fast. This one is on a test whose assertion is a rate, which no amount of speedup makes
# schedule-independent: on a 2-core runner it was landing next to `test_concurrent_batch_requests`
# and `test_mixed_concurrent_requests`, two other server-load tests, and three concurrent load
# generators on two cores starve each other by construction. Measured consequence: 9 attempts
# against a floor of 15, every request a 2xx (CI run 30715580598).
#
# Belt-and-braces with the test-side fix: the floor is now a liveness check (2 per worker), so
# this override buys margin rather than being load-bearing.
[[profile.default.overrides]]
filter = "test(test_sustained_load)"
threads-required = "num-test-threads"

[profile.full]
default-filter = "all()"
slow-timeout = { period = "60s" }

[[profile.full.overrides]]
filter = "test(test_sustained_load)"
threads-required = "num-test-threads"

# The `threads-required = 4` reservation for test(test_feed_steering_large_offset) was deleted
# 2026-08-01 by P10-perf, exactly as its own comment anticipated ("safe to delete along with
# the override when P10-perf brings the cost down"). It existed because that ~5°-steer geometry
# was the suite's most oversubscription-sensitive test — 27.6 s idle, 35.0 s contended. It now
# runs in 4.0 s against a 300 s budget, so reserving slots for it costs parallelism and buys
# nothing.

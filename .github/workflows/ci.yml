name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a PR push doesn't pile up jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # RUST_MIN_STACK=16777216 lived here from 2026-07-09 (4b439c0) until roadmap D3
  # retired it. It was added because the calibrate lib suite aborted with a stack
  # overflow on the Linux debug build, attributed to "the 3D→4D correction-surface
  # round-trip evaluation" being stack-hungry. That attribution was wrong: the 4D
  # evaluator was already an iterative Cox-de Boor loop at 4b439c0 itself, and the
  # only recursion on the path is depth-bounded by spline_order.
  #
  # What replaced that attribution is a hypothesis, not a proof, and is recorded as one:
  # the crashing test fitted a surface, and at that commit the fit solved its normal
  # equations through ndarray-linalg/OpenBLAS (`solve_into`), a dependency deleted five
  # days later in 62fc3e5. That fits every known fact but was never reproduced — doing so
  # needs a Linux build of the July tree, which requires system OpenBLAS. The removal here
  # does not rest on it; it rests on the measurement below.
  #
  # The path now runs in a 24 KiB thread stack (measured 2026-08-20), and
  # `the_round_trip_fits_in_a_small_thread_stack` in
  # calibrate/tests/artifact_export_integration_test.rs pins it at 512 KiB on every
  # platform, so a regression fails locally instead of only here. Do not restore this
  # variable without first checking what that test reports — a green run with it set
  # proves nothing, which is how it stayed for a month after it stopped mattering.

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Clippy (antenna-core, openapi feature OFF)
        # See scripts/check.sh: the workspace build unifies this feature ON, so
        # this is the only check that compiles the configuration the CLI builds
        # under (roadmap D4).
        run: cargo clippy -p antenna-core --all-targets -- -D warnings
      - name: Build calibrate package-scoped (no web stack)
        # The only build that uses calibrate's normal deps alone, plus the
        # dep-graph assertions that keep the web stack out of the CLI (roadmap
        # D4) and the config-file stack out of antenna-core (roadmap D27).
        #
        # Runs the SAME script scripts/check.sh does. It used to be copy-pasted
        # from there, so the banned-crate list lived in four places with nothing
        # detecting drift — and both copies carried the same fail-open bug
        # (roadmap D27).
        run: ./scripts/assert-dep-graphs.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (calibrate, s3-input feature ON)
        # `s3-input` is OFF by default (roadmap D6), so every check above compiles only
        # the stub side of parser::fetch_from_s3. This is the one check that compiles the
        # real AWS client, so the optional path cannot rot unnoticed. Package-scoped and
        # without --all-targets on purpose: --all-targets re-unifies features via the
        # dev-dependency antenna-model (same trap as the D4 dep-graph note above).
        run: cargo clippy -p calibrate --features s3-input -- -D warnings
      - name: Test
        # full profile = both test tiers (see .config/nextest.toml, roadmap
        # unit D18). The default profile is the dev inner loop and excludes
        # the slow tier; the gate must run everything.
        run: cargo nextest run --workspace --profile full
      - name: Doc tests
        # nextest doesn't run doctests (https://github.com/nextest-rs/nextest/issues/16);
        # `cargo test --workspace` used to cover these, so run them separately or they
        # silently stop executing in CI.
        run: cargo test --doc --workspace

  audit:
    name: cargo audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisories are tracked, not gating, until the allowlist policy is set
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

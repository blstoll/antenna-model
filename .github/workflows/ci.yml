name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref so a PR push doesn't pile up jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # libtest runs each test on a worker thread with a ~2 MiB default stack. The
  # calibrate 3D→4D correction-surface round-trip evaluation is stack-hungry and
  # overflows that on the Linux debug build (it passes on macOS). Give test
  # threads more headroom. (Making the evaluation iterative is roadmap unit D3.)
  RUST_MIN_STACK: "16777216"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy-test:
    name: clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: Clippy (antenna-core, openapi feature OFF)
        # See scripts/check.sh: the workspace build unifies this feature ON, so
        # this is the only check that compiles the configuration the CLI builds
        # under (roadmap D4).
        run: cargo clippy -p antenna-core --all-targets -- -D warnings
      - name: Build calibrate package-scoped (no web stack)
        # The only build that uses calibrate's normal deps alone, plus the
        # dep-graph assertion that keeps the web stack out (roadmap D4).
        #
        # Runs the SAME script scripts/check.sh does. It used to be copy-pasted
        # from there, so the banned-crate list lived in four places with nothing
        # detecting drift — and both copies carried the same fail-open bug
        # (roadmap D27).
        run: ./scripts/assert-calibrate-dep-graph.sh
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        # full profile = both test tiers (see .config/nextest.toml, roadmap
        # unit D18). The default profile is the dev inner loop and excludes
        # the slow tier; the gate must run everything.
        run: cargo nextest run --workspace --profile full
      - name: Doc tests
        # nextest doesn't run doctests (https://github.com/nextest-rs/nextest/issues/16);
        # `cargo test --workspace` used to cover these, so run them separately or they
        # silently stop executing in CI.
        run: cargo test --doc --workspace

  audit:
    name: cargo audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true  # advisories are tracked, not gating, until the allowlist policy is set
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit
        run: cargo audit

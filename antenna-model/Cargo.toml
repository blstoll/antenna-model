[package]
name = "antenna-model"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
antenna-core = { path = "../antenna-core", features = ["openapi"] }
config = "0.15.25"
dashmap = "6.2.0"
h3o = "0.10.0"
lru = "0.18.1"
parking_lot = "0.12.5"
poem = { version = "3.1.12", features = ["test"] }
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
# `/status`'s `memory_bytes` (roadmap F6). `default-features = false` drops the
# `disk`/`network`/`component`/`user` collectors, which this crate never reads;
# `system` alone is what carries `Process::memory()`.
#
# It replaces a hand-rolled `/proc/self/statm` read that was Linux-only *and*
# wrong off x86: it multiplied the RSS page count by a hardcoded 4096, so on an
# aarch64 kernel with 16K or 64K pages it under-reported by 4x or 16x. sysinfo
# reads the same file and multiplies by `sysconf(_SC_PAGESIZE)`.
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tokio = { version = "1.53.0", features = [
    "rt-multi-thread",
    "signal",
    "macros",
    "sync",
    "time",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# Pinned exactly: tests/openapi_spec.rs asserts byte-for-byte equality between the
# committed openapi.yaml and `ApiDoc::openapi().to_yaml()`, so any change to utoipa's
# serialization is a contract diff that must arrive as a deliberate upgrade PR.
# `preserve_order`/`preserve_path_order` make emission order deterministic
# (declaration/registration order); `preserve_order` also unifies
# `serde_json/preserve_order` workspace-wide (audited: no test relies on
# alphabetical Value-map ordering).
utoipa = { version = "=5.5.0", features = [
    "macros",
    "yaml",
    "preserve_order",
    "preserve_path_order",
] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
# Test-only: the Hankel reference oracle in tests/reference_validation.rs.
num-complex = "0.4.6"
# Test-only: `src/data/repository.rs`'s `#[cfg(test)]` helper, which writes a bare
# postcard payload (no ANTC header) for the repository's own unit tests.
# default-features off drops the `heapless-cas` default, which pulls heapless 0.7
# → the unmaintained atomic-polyfill (RUSTSEC-2023-0089). We only need std ser/de.
postcard = { version = "1.1.3", default-features = false, features = [
    "use-std",
] }
# Test-only HTTP client for the integration suite, which talks to an ephemeral
# **loopback** port over plain HTTP and nothing else.
#
# `default-features = false` is load-bearing for test latency, not hygiene. The
# default set includes `system-proxy`, and on macOS constructing ANY client then
# queries the system proxy configuration through SCDynamicStore: measured
# 2026-08-15, `reqwest::Client::builder().build()` cost **11.8 s**, against 2.7 ms
# to load the whole calibration repository. Every test that builds a client paid
# it — `test_health_endpoint`, which starts a server and does one GET, took 12.0 s
# of which 11.8 s was this line. Dropping the feature: 8 ms, and that test is now
# 0.18 s. See docs/findings-2026-08-15-test-suite-execution-time.md.
#
# Also dropped, all unreachable for a loopback plain-HTTP client: `default-tls` /
# `rustls` (no https), `http2` (poem serves 1.1 here), `charset` (fixture bodies
# are UTF-8 JSON). If a test ever needs one, add that feature back by name —
# do NOT restore `default-features`, which would silently reinstate `system-proxy`
# and put 12 s back on every test in the suite.
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
# test-util enables tokio's paused/mocked clock for `#[tokio::test(start_paused = true)]`
# (roadmap S5 shutdown-delay test). Dev-only: it must never affect production runtime
# behavior, so it is not added to the main `tokio` dependency's features.
tokio = { version = "1.53.0", features = ["test-util"] }

[[bench]]
name = "computation_modes"
harness = false

[[bench]]
name = "aperture_integration_benchmarks"
harness = false

[[bench]]
name = "heatmap_benchmarks"
harness = false

[package]
name = "calibrate"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.103"
argmin = "0.11.0"
argmin-math = { version = "0.5.0", features = ["ndarray_v0_16-nolinalg"] }
# The AWS subtree is OPTIONAL and off by default (roadmap D6). It backs exactly one
# feature — reading a measurement CSV from an `s3://` URL in `parser.rs` — and it is by
# far the heaviest thing this CLI could link. Enable with `--features s3-input`.
# Without it, an `s3://` source fails with an actionable error naming the flag.
aws-config = { version = "1.9.0", optional = true }
# default-features disabled to drop the legacy rustls 0.21 TLS connector (the
# `rustls` default feature = aws-smithy-runtime/tls-rustls), which pulls the
# vulnerable rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). The actual
# HTTPS client is `default-https-client` (rustls-aws-lc → rustls 0.23), kept below.
aws-sdk-s3 = { version = "1.138.1", optional = true, default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
csv = "1.4.0"
ndarray = "0.16.1"                                                         # Match argmin-math requirement
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
# Backs the two per-measurement-point physics sweeps that dominate every full-mode run:
# the tuner's objective (`parameter_tuner.rs`) and `main.rs::compute_model_predictions`.
# Both are embarrassingly parallel over points and were serial until roadmap D18 task 3.
#
# Every parallel site here collects into an INDEX-ORDERED Vec before reducing, so the
# summation order is the serial order and results are bit-for-bit identical — see the
# comment at each call site. A parallel *reduction* would not be, and must not be
# introduced: this crate's tests assert measured constants to four decimal places.
#
# Not a new package in the lockfile: antenna-model already depends on rayon, so
# `cargo audit`'s surface is unchanged.
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
# `macros` + `rt-multi-thread` back `#[tokio::main]` in main.rs (and the runtime
# aws-sdk-s3's `rt-tokio` needs). Declared explicitly since D4: these used to
# arrive by feature unification from the antenna-model dependency, so dropping
# that dependency broke a package-scoped `cargo build -p calibrate` while a
# whole-workspace build still passed. Nothing here is web stack.
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
# `env-filter` backs `EnvFilter` / `.with_env_filter()` in main.rs — same D4
# unification story as tokio above.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Physics engine + artifact types. Deliberately antenna-core, not
# antenna-model: the CLI build must not compile the web stack (roadmap D4).
antenna-core = { path = "../antenna-core" }

[features]
# Off by default (roadmap D6). Reading measurements from `s3://` pulls the whole AWS SDK
# subtree — 160 of the 240 packages calibrate would otherwise compile, 25 of them `aws-*`
# — for a source almost every run does not use. What is COMPILED drops from 240 to 80.
#
# This does NOT change what `cargo audit` reports, and an earlier version of this comment
# wrongly claimed it did. `cargo audit` scans `Cargo.lock`, and an optional dependency
# stays in the lockfile: all 25 `aws-*` entries are still there, so the advisory surface
# is byte-identical either way. The win here is build weight and compiled dependency
# surface. To act on advisories, resolve them or allowlist them with a reason.
#
# The gate is asserted, not just declared: `scripts/assert-dep-graphs.sh` checks that a
# default `cargo build -p calibrate` resolves NO aws-* package, with a negative control
# proving the detector fires when the feature is on. A dependency that only *documents*
# itself as optional is the kind of guard roadmap P13 records rotting.
default = []
s3-input = ["dep:aws-config", "dep:aws-sdk-s3"]

[dev-dependencies]
tempfile = "3.27.0"
# Test-only: the e2e tests deliberately serve generated artifacts through the
# real service loader/evaluator (`service::compute_gain_from_request`) — the
# served path is what caught C13. Dev-only so the CLI build stays web-free.
antenna-model = { path = "../antenna-model" }

[package]
name = "calibrate"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.103"
argmin = "0.11.0"
argmin-math = { version = "0.5.0", features = ["ndarray_v0_16-nolinalg"] }
aws-config = "1.9.0"
# default-features disabled to drop the legacy rustls 0.21 TLS connector (the
# `rustls` default feature = aws-smithy-runtime/tls-rustls), which pulls the
# vulnerable rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104). The actual
# HTTPS client is `default-https-client` (rustls-aws-lc → rustls 0.23), kept below.
aws-sdk-s3 = { version = "1.138.1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
chrono = "0.4.45"
clap = { version = "4.6.2", features = ["derive"] }
crc32fast = "1"
csv = "1.4.0"
ndarray = "0.16.1"                                                         # Match argmin-math requirement
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
# `macros` + `rt-multi-thread` back `#[tokio::main]` in main.rs (and the runtime
# aws-sdk-s3's `rt-tokio` needs). Declared explicitly since D4: these used to
# arrive by feature unification from the antenna-model dependency, so dropping
# that dependency broke a package-scoped `cargo build -p calibrate` while a
# whole-workspace build still passed. Nothing here is web stack.
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.44"
# `env-filter` backs `EnvFilter` / `.with_env_filter()` in main.rs — same D4
# unification story as tokio above.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Physics engine + artifact types. Deliberately antenna-core, not
# antenna-model: the CLI build must not compile the web stack (roadmap D4).
antenna-core = { path = "../antenna-core" }

[dev-dependencies]
tempfile = "3.27.0"
# Test-only: the e2e tests deliberately serve generated artifacts through the
# real service loader/evaluator (`service::compute_gain_from_request`) — the
# served path is what caught C13. Dev-only so the CLI build stays web-free.
antenna-model = { path = "../antenna-model" }

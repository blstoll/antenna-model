openapi: 3.0.3
info:
  title: Antenna Model Service API
  description: |
    High-accuracy antenna loss modeling system providing REST API access to antenna models
    with flexible calibration statuses. Supports real-time queries for G/T (Gain-to-Temperature)
    predictions based on 3D geometric configuration.

    ## Calibration Statuses

    The system supports multiple calibration statuses:
    - **Fully Calibrated**: ±1 dB accuracy (main lobe/first sidelobe)
    - **Partially Calibrated (Boresight)**: ±1 dB at boresight, ±1-2 dB loss
    - **Partially Calibrated (Limited Coverage)**: ±1-1.5 dB in-coverage, ±2-3 dB extrapolated
    - **Uncalibrated**: ±3-5 dB absolute gain, ±2-3 dB loss (design specs only)

    ## Coordinate Systems

    Every 3D position must declare its frame in the required `coordinate_system` field:
    - **`ecef`**: x, y, z in meters from Earth's centre
    - **`geodetic`**: x = longitude degrees, y = latitude degrees, z = altitude meters

    There is no auto-detection. A position that omits `coordinate_system` is rejected
    with **400 `invalid_request_body`** naming the field.

  version: 1.1.0
  contact:
    name: Antenna Model Service Support
  license:
    name: Proprietary
    url: https://example.com/license

security: []  # No authentication required (internal service)

servers:
  - url: http://localhost:3000
    description: Local development server
  - url: http://antenna-model-service
    description: Kubernetes cluster internal service

tags:
  - name: health
    description: Health check and service status endpoints
  - name: gain
    description: Antenna gain computation endpoints
  - name: heatmap
    description: Loss heatmap generation
  - name: antennas
    description: Antenna and feed configuration queries

paths:
  /health:
    get:
      tags:
        - health
      summary: Health check (liveness probe)
      description: |
        Always returns 200 while the process is responsive. Used for the Kubernetes liveness
        probe, so it deliberately never returns a failure status: a restart cannot fix
        missing calibration data.

        The `status` field reports `healthy` when calibration data is loaded, or `degraded`
        when the service is running with an empty repository (calibration load failed and
        `calibration.fail_fast` was off). A degraded instance never becomes ready, so it
        receives no traffic — see `/ready`.
      operationId: getHealth
      responses:
        '200':
          description: Service is responsive ("healthy", or "degraded" with no data loaded)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags:
        - health
      summary: Readiness check (readiness probe)
      description: |
        Returns 200 only once the calibration load has completed successfully. Returns 503
        during startup, when the calibration load failed, and for the whole graceful-shutdown
        drain window.
      operationId: getReady
      responses:
        '200':
          description: 'Service is ready to serve requests ({"status": "ready"})'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: |
            Not ready — startup, failed calibration load, or shutting down
            ({"status": "not_ready"}).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /status:
    get:
      tags:
        - health
      summary: Service status and metadata
      description: Returns comprehensive service information including loaded antennas, uptime, and version.
      operationId: getStatus
      responses:
        '200':
          description: Service status information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/v1/gain:
    post:
      tags:
        - gain
      summary: Compute antenna gain from 3D geometric configuration
      description: |
        Computes antenna gain for a specific geometric configuration including vehicle position,
        antenna orientation, feed position, and emitter location. Each position declares
        its own frame — ECEF or Geodetic — in its required `coordinate_system` field.

        Optionally computes reference gain (ideal case) and loss (reference - actual).
      operationId: computeGain
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GainRequest'
            examples:
              ecef_coordinates:
                summary: ECEF coordinates example
                value:
                  antenna_id: "antenna_1"
                  feed_id: "x_band_feed"
                  vehicle_position:
                    x: 4510731.123
                    y: 4510731.456
                    z: 3488865.789
                    coordinate_system: "ecef"
                  vehicle_attitude: [1.0, 0.0, 0.0, 0.0]
                  reflector_boresight:
                    x: 4510732.0
                    y: 4510732.0
                    z: 3488950.0
                    coordinate_system: "ecef"
                  feed_pointing_location:
                    x: 4510731.5
                    y: 4510731.5
                    z: 3488870.0
                    coordinate_system: "ecef"
                  emitter_position:
                    x: 4520000.0
                    y: 4520000.0
                    z: 3500000.0
                    coordinate_system: "ecef"
                  frequency_mhz: 8400.0
                  include_reference: true
              geodetic_coordinates:
                summary: Geodetic coordinates example
                value:
                  antenna_id: "antenna_2"
                  feed_id: "s_band_feed"
                  vehicle_position:
                    x: -118.1234
                    y: 34.5678
                    z: 100.0
                    coordinate_system: "geodetic"
                  vehicle_attitude: [1.0, 0.0, 0.0, 0.0]
                  reflector_boresight:
                    x: -117.0
                    y: 35.0
                    z: 400000.0
                    coordinate_system: "geodetic"
                  feed_pointing_location:
                    x: -118.124
                    y: 34.568
                    z: 105.0
                    coordinate_system: "geodetic"
                  emitter_position:
                    x: -117.0
                    y: 35.0
                    z: 400000.0
                    coordinate_system: "geodetic"
                  frequency_mhz: 2200.0
                  include_reference: false
      responses:
        '200':
          description: Gain computation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GainResponse'
              examples:
                partially_calibrated:
                  summary: Partially calibrated antenna response
                  value:
                    antenna_id: "antenna_2"
                    feed_id: "x_band_feed"
                    gain_db: 41.2
                    reference_gain_db: 43.5
                    loss_db: 2.3
                    geometry:
                      physical_feed_offset_m:
                        x: 0.05
                        y: 0.02
                        z: 0.01
                      emitter_azimuth_deg: 185.5
                      emitter_elevation_deg: 32.1
                      beam_squint_deg: 0.15
                    warnings:
                      - code: "partially_calibrated"
                        message: "Antenna 'antenna_2' is partially calibrated. Accuracy estimate: ±1.5 dB"
                      - code: "out_of_coverage"
                        message: "Query is outside calibrated region - using physics model extrapolation"
                    metadata:
                      computation_time_ms: 2.8
                      extrapolated: true
                    calibration_status:
                      status: "partially_calibrated"
                      accuracy_estimate_db: 1.5
                      coverage:
                        azimuth_range_deg: [0.0, 0.0]
                        elevation_range_deg: [0.0, 0.0]
                        frequency_range_mhz: [7100.0, 8500.0]
                        num_measurements: 25
                        is_boresight_only: true
                      correction_applied: false
                      parameters_source: "boresight_tuning"
                uncalibrated:
                  summary: Uncalibrated antenna response
                  value:
                    antenna_id: "antenna_3"
                    feed_id: "x_band_feed"
                    gain_db: 40.5
                    reference_gain_db: 43.8
                    loss_db: 3.3
                    geometry:
                      physical_feed_offset_m:
                        x: 0.0
                        y: 0.0
                        z: 0.0
                      emitter_azimuth_deg: 45.2
                      emitter_elevation_deg: 78.9
                    warnings:
                      - code: "uncalibrated"
                        message: "Antenna 'antenna_3' is uncalibrated (using design specifications). Absolute gain accuracy: ±3.0 dB, Loss accuracy: ±2.0 dB"
                    metadata:
                      computation_time_ms: 1.5
                      extrapolated: false
                    calibration_status:
                      status: "uncalibrated"
                      accuracy_estimate_db: 3.0
                      loss_accuracy_estimate_db: 2.0
                      correction_applied: false
                      parameters_source: "design_specifications"
        '400':
          description: |
            The request body could not be parsed. This is the only condition that
            returns 400 (roadmap C2) — a body that parses but is invalid returns 422.

            Note that a non-finite number lands here rather than in 422: JSON cannot
            encode `NaN` or `Infinity`, so serializers emit `null`, which does not
            deserialize into the numeric fields this schema declares.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unparseable_body:
                  summary: Malformed JSON
                  value:
                    error: "invalid_request_body"
                    message: "parse error: expected value at line 1 column 3"
        '422':
          description: |
            The body parsed but is semantically invalid. Applies whether the failure is
            caught by the request pre-check or surfaces from the service layer — the
            client cannot tell, and should not have to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_frequency:
                  summary: Frequency out of range
                  value:
                    error: "validation_error"
                    message: "frequency 0 MHz is outside supported range [100, 50000] MHz"
                    field: "frequency_mhz"
                degenerate_geometry:
                  summary: Boresight coincident with vehicle position
                  value:
                    error: "invalid_coordinate"
                    message: "invalid coordinate for 'reflector_boresight': Boresight position too close to vehicle position (< 1mm separation)"
        '404':
          description: |
            The request names an antenna or feed that does not exist. Absence is not
            invalidity: no change to the body will make a missing antenna appear, so
            this is a 404 rather than a 422 (roadmap C2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                antenna_not_found:
                  summary: Antenna not found
                  value:
                    error: "antenna_not_found"
                    message: "Antenna 'invalid_antenna' not found"
                    field: "antenna_id"
                feed_not_found:
                  summary: Feed not found
                  value:
                    error: "feed_not_found"
                    message: "Feed 'invalid_feed' not found for antenna 'antenna_1'"
                    field: "feed_id"
        '413':
          description: |
            Request body exceeds the configured maximum size
            (`server.max_body_size_bytes`, default 10 MB).

            Enforced on both framings (roadmap S1b): a declared `content-length` over the
            limit is rejected before the body is read, and a body sent with
            `Transfer-Encoding: chunked` is rejected as soon as the bytes read exceed the
            limit. The chunked path cannot report a byte count in the message, since the
            size is never declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                payload_too_large:
                  summary: Payload too large
                  value:
                    error: "payload_too_large"
                    message: "Request body of 12000000 bytes exceeds the maximum of 10485760 bytes"
        '504':
          description: |
            A server-side wall-clock budget was exceeded. Two distinct budgets map here, told
            apart by the machine `error` code:

            - `request_timeout` — the whole request exceeded `server.request_timeout_secs`
              (default 30 s, roadmap S2). The server stops waiting and responds, but the
              background compute is NOT cancelled and runs to completion.
            - `computation_budget_exceeded` — a SINGLE aperture integration exceeded
              `performance.integration_budget_ms` (default 30 000 ms, roadmap S3), aborting
              that integration cooperatively. This caps one integral, not the whole request;
              a large fan-out (heatmap/batch) can still spend `budget × points` of background
              CPU after an S2 504.

            504 (a 5xx) is used rather than 408 because the overrun is server-side and
            deterministic in the request payload — there is no honest Retry-After; the remedy
            is a smaller request, not waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_timeout:
                  summary: Whole-request timeout (S2)
                  value:
                    error: "request_timeout"
                    message: "Request processing exceeded the configured timeout of 30000 ms"
                computation_budget_exceeded:
                  summary: Single integration over budget (S3)
                  value:
                    error: "computation_budget_exceeded"
                    message: "computation exceeded time budget in azimuthal_mode_field: 31000 ms > 30000 ms budget"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/gain/batch:
    post:
      tags:
        - gain
      summary: Batch gain computation
      description: |
        Processes multiple gain computation requests in a single API call.
        Automatically uses parallel processing for batches ≥5 requests.

        Maximum batch size: 1000 evaluations.
      operationId: computeGainBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGainRequest'
      responses:
        '200':
          description: |
            Batch computation successful.

            May still include per-item failures, but only *compute*-class ones — an
            integration over budget, or one that did not converge — which cannot be
            predicted before running the integral. Such an item carries a `null`
            `gain_db` (a NaN, as JSON has no NaN literal) and the reason in its
            `warnings`. Validation-class failures never reach this response: they reject
            the whole batch (roadmap C2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGainResponse'
        '400':
          description: |
            The request body could not be parsed. See `/api/v1/gain` for the full
            400-vs-422 rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unparseable_body:
                  summary: Malformed JSON
                  value:
                    error: "invalid_request_body"
                    message: "parse error: expected value at line 1 column 3"
        '422':
          description: |
            The batch parsed but is semantically invalid — empty, over the 1000-item
            limit, or containing an invalid evaluation.

            Every item is validated before any physics runs, and the first failure
            rejects the whole request. `field` carries the offending item's path
            (`evaluations[3]`) so a client can locate it without parsing the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                empty_batch:
                  summary: Empty evaluations array
                  value:
                    error: "validation_error"
                    message: "invalid value for parameter 'evaluations': batch must contain at least one evaluation"
                    field: "evaluations"
                size_limit:
                  summary: Over the batch size limit
                  value:
                    error: "validation_error"
                    message: "batch size 1001 exceeds limit of 1000"
                    field: "evaluations"
                invalid_item:
                  summary: One evaluation is invalid
                  value:
                    error: "validation_error"
                    message: "evaluations[3]: frequency 0 MHz is outside supported range [100, 50000] MHz"
                    field: "evaluations[3]"
        '404':
          description: |
            An evaluation names an antenna or feed that does not exist. Rejects the whole
            batch, with the offending item's path in `field`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                antenna_not_found:
                  summary: Unknown antenna in one item
                  value:
                    error: "antenna_not_found"
                    message: "evaluations[3]: antenna 'invalid_antenna' not found"
                    field: "evaluations[3]"
        '413':
          description: |
            Request body exceeds the configured maximum size
            (`server.max_body_size_bytes`, default 10 MB).

            Enforced on both framings (roadmap S1b): a declared `content-length` over the
            limit is rejected before the body is read, and a body sent with
            `Transfer-Encoding: chunked` is rejected as soon as the bytes read exceed the
            limit. The chunked path cannot report a byte count in the message, since the
            size is never declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                payload_too_large:
                  summary: Payload too large
                  value:
                    error: "payload_too_large"
                    message: "Request body of 12000000 bytes exceeds the maximum of 10485760 bytes"
        '504':
          description: |
            A server-side wall-clock budget was exceeded. Two distinct budgets map here, told
            apart by the machine `error` code:

            - `request_timeout` — the whole request exceeded `server.request_timeout_secs`
              (default 30 s, roadmap S2). The server stops waiting and responds, but the
              background compute is NOT cancelled and runs to completion.
            - `computation_budget_exceeded` — a SINGLE aperture integration exceeded
              `performance.integration_budget_ms` (default 30 000 ms, roadmap S3), aborting
              that integration cooperatively. This caps one integral, not the whole request;
              a large fan-out (heatmap/batch) can still spend `budget × points` of background
              CPU after an S2 504.

            504 (a 5xx) is used rather than 408 because the overrun is server-side and
            deterministic in the request payload — there is no honest Retry-After; the remedy
            is a smaller request, not waiting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_timeout:
                  summary: Whole-request timeout (S2)
                  value:
                    error: "request_timeout"
                    message: "Request processing exceeded the configured timeout of 30000 ms"
                computation_budget_exceeded:
                  summary: Single integration over budget (S3)
                  value:
                    error: "computation_budget_exceeded"
                    message: "computation exceeded time budget in azimuthal_mode_field: 31000 ms > 30000 ms budget"
        '503':
          description: |
            Admission control (roadmap S4): the server is already running the maximum
            number of concurrent heavy requests (batch / heatmap / h3-heatmap), configured
            by `performance.max_concurrent_heavy_requests` and shared across those three
            endpoints. The request was rejected immediately (never queued). Unlike the 504
            timeout, this is a transient overload — a slot frees as soon as an in-flight
            heavy request finishes — so a `Retry-After` header is included. Never returned
            when the limit is 0 (the default; admission control disabled).
          headers:
            Retry-After:
              description: Seconds to wait before retrying (performance.admission_retry_after_secs).
              schema:
                type: integer
              example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                service_overloaded:
                  summary: Heavy-request concurrency limit reached (S4)
                  value:
                    error: "service_overloaded"
                    message: "Server is at its concurrent heavy-request limit (8); retry after 5 s"

  /api/v1/heatmap:
    post:
      tags:
        - heatmap
      summary: Generate loss heatmap
      description: |
        Generates a 2D loss heatmap across antenna field of view.
        Supports rectangular azimuth/elevation grids.

        Loss is computed relative to peak gain for each grid point.
        Maximum grid size: 100,000 points.
      operationId: generateHeatmap
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeatmapRequest'
            examples:
              rectangular_grid:
                summary: Rectangular grid (73x46 = 3358 points)
                value:
                  antenna_id: "antenna_1"
                  feed_id: "x_band_feed"
                  vehicle_position:
                    x: 4510731.123
                    y: 4510731.456
                    z: 3488865.789
                    coordinate_system: "ecef"
                  vehicle_attitude: [1.0, 0.0, 0.0, 0.0]
                  reflector_boresight:
                    x: 4510732.0
                    y: 4510732.0
                    z: 3488950.0
                    coordinate_system: "ecef"
                  feed_pointing_location:
                    x: 4510731.5
                    y: 4510731.5
                    z: 3488870.0
                    coordinate_system: "ecef"
                  frequency_mhz: 8400.0
                  grid_config:
                    grid_type: "rectangular"
                    azimuth_range_deg:
                      min: 0.0
                      max: 360.0
                      step: 5.0
                    elevation_range_deg:
                      min: 0.0
                      max: 90.0
                      step: 2.0
      responses:
        '200':
          description: Heatmap generation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeatmapResponse'
        '400':
          description: |
            The request body could not be parsed. See `/api/v1/gain` for the full
            400-vs-422 rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unparseable_body:
                  summary: Malformed JSON
                  value:
                    error: "invalid_request_body"
                    message: "parse error: expected value at line 1 column 3"
        '422':
          description: |
            The body parsed but is semantically invalid — an out-of-range value, a
            degenerate geometry, a grid exceeding 100,000 points, or the unimplemented
            H3 grid type (`not_implemented`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_grid:
                  summary: Grid too large
                  value:
                    error: "validation_error"
                    message: "invalid grid specification for rectangular: total grid points 324000 exceeds maximum 100000 (1800x180 grid)"
                not_implemented:
                  summary: H3 grid type on /heatmap
                  value:
                    error: "not_implemented"
                    message: "feature not implemented: H3 grid heatmap"
        '404':
          description: |
            The request names an antenna or feed that does not exist (roadmap C2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                antenna_not_found:
                  summary: Antenna not found
                  value:
                    error: "antenna_not_found"
                    message: "antenna 'invalid_antenna' not found"
        '413':
          description: |
            Request body exceeds the configured maximum size
            (`server.max_body_size_bytes`, default 10 MB).

            Enforced on both framings (roadmap S1b): a declared `content-length` over the
            limit is rejected before the body is read, and a body sent with
            `Transfer-Encoding: chunked` is rejected as soon as the bytes read exceed the
            limit. The chunked path cannot report a byte count in the message, since the
            size is never declared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                payload_too_large:
                  summary: Payload too large
                  value:
                    error: "payload_too_large"
                    message: "Request body of 12000000 bytes exceeds the maximum of 10485760 bytes"
        '504':
          description: |
            A server-side wall-clock budget was exceeded. Two distinct budgets map here, told
            apart by the machine `error` code:

            - `request_timeout` — the whole request exceeded `server.request_timeout_secs`
              (default 30 s, roadmap S2). The server stops waiting and responds, but the
              background compute is NOT cancelled and runs to completion.
            - `computation_budget_exceeded` — a SINGLE aperture integration exceeded
              `performance.integration_budget_ms` (default 30 000 ms, roadmap S3), aborting
              that integration cooperatively. This caps one integral, not the whole request;

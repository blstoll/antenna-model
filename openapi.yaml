        calibration_status:
          type: string
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeedInfo'
        physical_parameters:
          $ref: '#/components/schemas/PhysicalParametersInfo'
        validity_ranges:
          $ref: '#/components/schemas/ValidityRangesInfo'
        calibration_info:
          $ref: '#/components/schemas/CalibrationInfo'
        calibration_status_info:
          $ref: '#/components/schemas/CalibrationStatusInfo'
          nullable: true

    FeedInfo:
      type: object
      # DRIFT (filed, not fixed here — C8 stage 4 / C7): apart from
      # design_feed_offset_m and q_factor, this schema does not match what the
      # service serves. The Rust FeedInfo (api/schemas.rs) emits `id` (not
      # `feed_id`), `frequency_range_mhz` (not `frequency_range`), and no `name`
      # or `phase_center_offset_m` at all. C8 stage 1 corrected only the field it
      # renamed; the rest is spec-completeness work for the drift guard.
      properties:
        feed_id:
          type: string
        name:
          type: string
        design_feed_offset_m:
          type: object
          description: >
            The feed's DESIGN offset from the focal point in the antenna frame
            (meters) - a static property of this antenna's configuration, identical
            for every request. The per-request total (this design offset plus the
            beam-steering displacement) is reported as
            GeometryInfo.physical_feed_offset_m.

            z is positive AWAY from the reflector vertex, matching the phase model's
            delta_z convention.
          properties:
            x:
              type: number
            y:
              type: number
            z:
              type: number
        q_factor:
          type: number
        phase_center_offset_m:
          type: number
        frequency_range:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2

    PhysicalParametersInfo:
      type: object
      properties:
        diameter_m:
          type: number
        f_over_d:
          type: number
        surface_rms_mm:
          type: number
        feed:
          type: object
          properties:
            q_factor:
              type: number
            phase_center_offset_m:
              type: number
        mesh:
          type: object
          nullable: true
          properties:
            mesh_spacing_mm:
              type: number
            wire_diameter_mm:
              type: number

    ValidityRangesInfo:
      type: object
      properties:
        azimuth:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        elevation:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        frequency:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        temperature:
          type: number

    CalibrationInfo:
      type: object
      properties:
        calibration_date:
          type: string
        format_version:
          type: string
        data_source:
          type: string
        rmse_db:
          type: number
        num_measurements:
          type: integer
        parameters_tuned:
          type: boolean

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"

    StatusResponse:
      type: object
      properties:
        status:
          type: string
        uptime_seconds:
          type: number
        version:
          type: string
        antenna_count:
          type: integer
        antenna_ids:
          type: array
          items:
            type: string
        memory_usage_mb:
          type: number
          nullable: true

    ApiWarning:
      type: object
      description: |
        A warning about result quality. Warnings never change the HTTP status: the
        response is a successful computation that carries a caveat.

        `code` is the contract and is safe to branch on; `message` is for humans and
        may be reworded in any release. Several messages interpolate query-specific
        values (thresholds, angles, percentages) — do not parse them.

        On `/heatmap` and `/h3-heatmap` warnings are aggregated across all evaluated
        points and deduplicated on the whole object (code AND message).
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: |
            Stable machine-readable warning code, always snake_case and always one of
            the enumerated values — the service emits no other code (it is a closed
            enum in `warnings.rs`, checked against this list by a CI drift test).

            * `extrapolated` — the correction surface was evaluated outside its knot
              range in at least one dimension; the correction is an extrapolation.
            * `out_of_coverage` — the query falls outside the region a partially
              calibrated antenna was measured over; the physics model is being
              extrapolated into it.
            * `correction_not_applied` — the antenna has a correction surface but it
              was not applied to this query; the returned gain is raw physics.
            * `uncalibrated` — modelled from design specifications, not measurements.
              The message carries the accuracy estimates.
            * `partially_calibrated` — calibration covers only part of the operating
              envelope. The message carries the accuracy estimate.
            * `off_axis_unvalidated` — the query is beyond ~3x the first-null angle
              (~1.6*lambda/D, beamwidth-relative) on an antenna served with
              uncorrected physics. Values there combine idealised physical optics
              (no blockage, strut scatter, or edge diffraction) with a statistical
              Ruze sidelobe floor as an incoherent power sum: a best-estimate MEDIAN
              wide-angle level tracking measured earth-station statistics (NTIA
              84-164), not a precise per-antenna prediction. Do not use in place of
              calibrated data for interference or off-axis-EIRP analysis; prefer a
              regulatory envelope such as the ITU-R S.580 mask.
            * `rear_hemisphere_invalid` — the query is more than 90 degrees off
              boresight. Fires for ANY antenna, calibrated or not: a
              forward-hemisphere correction surface says nothing about back lobes.
              The aperture-integration model has no physical validity behind the
              reflector. On antennas served with uncorrected physics the returned
              value is the statistical sidelobe floor only (the physical-optics term
              is excluded there); on antennas with a correction surface it is a
              numerical extrapolation, not a prediction. Real rear levels come from
              feed spillover past the rim, edge diffraction, and mesh leakage, none
              of which are modelled individually.
            * `non_convergence` — the aperture integration exhausted its iteration
              budget without meeting the convergence criterion; gain accuracy may be
              degraded.
            * `ray_trace_degraded` — the feed offset exceeds 0.5*f, so gain came from
              the acknowledged ray-tracing stub. Real ray tracing is gated as feature
              F2.
            * `severe_feed_offset` — edge-case analysis found the feed displaced more
              than 0.5*f from the focus. Reports the geometry; `ray_trace_degraded`
              reports what the model did about it.
            * `feed_offset_spillover_unmodeled` — the feed offset is in the 0.3*f–0.5*f
              band, where the exact coma phase still applies but spillover efficiency
              is not modelled.
            * `spillover_significant` — estimated feed spillover exceeds 10% of
              radiated power, enough to reduce aperture efficiency materially.
            * `points_extrapolated` — `/heatmap` grid summary: how many evaluated
              points carried `extrapolated`, `correction_not_applied`, or
              `out_of_coverage` — the three ways a returned value can be an
              extrapolation. The first two are exactly the per-point
              `metadata.extrapolated` flag returned by `/gain`.
            * `point_computation_failed` — at least one grid point (`/heatmap`) or
              cell (`/h3-heatmap`) could not be evaluated. Those points are counted
              in the response metadata and carry the failure sentinel.
          enum:
            - extrapolated
            - out_of_coverage
            - correction_not_applied
            - uncalibrated
            - partially_calibrated
            - off_axis_unvalidated
            - rear_hemisphere_invalid
            - non_convergence
            - ray_trace_degraded
            - severe_feed_offset
            - feed_offset_spillover_unmodeled
            - spillover_significant
            - points_extrapolated
            - point_computation_failed
        message:
          type: string
          description: >
            Human-readable explanation. Not part of the stability contract — display
            it, do not parse it.

    GainError:
      type: object
      description: |
        Why a single evaluation inside a batch produced no gain.

        Carried by `GainResponse.error` on failed `/api/v1/gain/batch` items only. A
        two-field subset of `ErrorResponse` drawing on the same `code` vocabulary, so
        the failure class survives into the item: an item that blew the integration
        budget reports `computation_budget_exceeded`, not a generic failure.

        The field is `code` rather than `error` because it sits inside a member
        already named `error`.
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: >
            Machine-readable failure class, drawn from the same vocabulary as
            ErrorResponse.error.
          enum:
            - antenna_not_found
            - feed_not_found
            - validation_error
            - invalid_coordinate
            - invalid_request_body
            - not_implemented
            - payload_too_large
            - request_timeout
            - computation_budget_exceeded
            - service_overloaded
            - internal_error
        message:
          type: string
          description: Human-readable explanation.

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: |
            Stable machine-readable error code. Always snake_case, and always one of the
            enumerated values — the service emits no other code. Defined once in code
            (`api/schemas.rs`, `mod error_codes`) and referenced by every emission site.

            Each code maps to exactly one status, uniformly across endpoints (roadmap
            C2): 400 = unparseable body, 422 = parsed but semantically invalid,
            404 = the named antenna or feed does not exist.
          enum:
            - antenna_not_found
            - feed_not_found
            - validation_error
            - invalid_coordinate
            - invalid_request_body
            - not_implemented
            - payload_too_large
            - request_timeout
            - computation_budget_exceeded
            - service_overloaded
            - internal_error
        message:
          type: string
          description: |
            Human-readable explanation. Not stable across releases — do not parse it.
        field:
          type: string
          description: |
            The request field that caused the error, when the service can attribute it to
            one. Omitted otherwise.
        details:
          type: string
          description: Additional context, when available. Omitted otherwise.

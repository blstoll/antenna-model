        '422':
          description: |-
            The body parsed but is semantically invalid — an out-of-range value, a
            degenerate geometry, or a grid exceeding 100,000 points.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_grid:
                  summary: Grid too large
                  value:
                    error: validation_error
                    message: 'invalid grid specification for rectangular: total grid points 324000 exceeds maximum 100000 (1800x180 grid)'
        '503':
          description: |
            Admission control (roadmap S4): the server is already running the maximum

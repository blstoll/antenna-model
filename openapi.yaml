  /api/v1/h3-heatmap:
    post:
      tags:
        - heatmap
      summary: Compute a per-cell link budget over an H3 hexagonal grid
      description: |
        Computes antenna gain, free-space path loss, total path loss and (optionally) G/T
        for every cell of an H3 hexagonal grid laid over the Earth's surface.

        The grid is centred on the H3 cell containing `feed_pointing_location` — the Earth location
        the feed's beam is aimed at, **not** the feed's physical location on the antenna —
        and covers `n_rings` rings around it, so the response contains
        `1 + 3 * n_rings * (n_rings + 1)` cells: 1, 7, 19, 37, … up to 331 at the maximum
        `n_rings` of 10.

        `h3_resolution` may be supplied explicitly (0-15). When it is absent the service
        derives it from `frequency_mhz`, on half-open bands: 6 below 2000 MHz, 7 from
        2000 up to but not including 8000 MHz, 8 from 8000 up to but not including
        20000 MHz, 9 at 20000 MHz and above. The resolution actually used is echoed in
        the response.

        Two per-cell quantities need their definitions read before use:

        - `loss_db` is `metadata.peak_gain_db - gain(this cell)` — relative to the **peak
          over the cells actually evaluated**, the same rule `/api/v1/heatmap` applies. It
          is therefore never negative and is exactly `0` at the peak cell, and
          `total_path_loss_db` (`= free_space_path_loss_db + loss_db`) never falls below
          the free-space value. Note that the peak of the *grid* need not be the peak of
          the *beam*: a grid that does not contain the beam peak understates loss for
          every cell in it.
        - `g_over_t_db` is `gain_db - 10*log10(temperature_k)` and is present only when the
          request supplies `temperature_k`. The temperature is a pure passthrough — the
          service models no antenna noise temperature of its own.

        Like `/api/v1/gain/batch` and `/api/v1/heatmap`, this is a compute-heavy endpoint and
        shares their admission-control limit and per-integration compute budget.
      operationId: computeH3LinkBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/H3LinkBudgetRequest'
            examples:
              ground_station_coverage:
                summary: 3.7 m ground station, 2 rings at resolution 7 (19 cells)
                value:
                  antenna_id: "gs_3.7m_uncalibrated"
                  feed_id: "s_band_feed"
                  vehicle_position:
                    x: -116.889
                    y: 35.4267
                    z: 1036.0
                    coordinate_system: "geodetic"
                  reflector_boresight:
                    x: -116.45
                    y: 35.4267
                    z: 800.0
                    coordinate_system: "geodetic"
                  feed_pointing_location:
                    x: -116.45
                    y: 35.4267
                    z: 800.0
                    coordinate_system: "geodetic"
                  frequency_mhz: 2200.0
                  n_rings: 2
                  h3_resolution: 7
                  temperature_k: 150.0
      responses:
        '200':
          description: Link budget computed for every cell in the grid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/H3LinkBudgetResponse'
        '400':
          description: |
            The request body could not be parsed. See `/api/v1/gain` for the full
            400-vs-422 rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                unparseable_body:
                  summary: Malformed JSON
                  value:
                    error: "invalid_request_body"
                    message: "parse error: expected value at line 1 column 3"
        '422':
          description: |
            The body parsed but is semantically invalid — an out-of-range value
            (`n_rings` above 10, `h3_resolution` outside 0-15, a non-positive
            `temperature_k`, a frequency outside 100-50000 MHz), or a degenerate geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                too_many_rings:
                  summary: n_rings above the maximum
                  value:
                    error: "validation_error"
                    message: "invalid value for parameter 'n_rings': n_rings must be ≤ 10"
                out_of_range_resolution:
                  summary: h3_resolution outside 0-15
                  value:
                    error: "validation_error"
                    message: "parameter 'h3_resolution' value 20 is out of valid range [0, 15]"
        '404':
          description: |
            The request names an antenna or feed that does not exist (roadmap C2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                antenna_not_found:
                  summary: Antenna not found
                  value:
                    error: "antenna_not_found"
                    message: "antenna 'invalid_antenna' not found"
        '413':
          description: |
            Request body exceeds the configured maximum size
            (`server.max_body_size_bytes`, default 10 MB). Enforced on both the
            `content-length` and `Transfer-Encoding: chunked` framings — see
            `/api/v1/heatmap` for the full description.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                payload_too_large:
                  summary: Payload too large
                  value:
                    error: "payload_too_large"
                    message: "Request body of 12000000 bytes exceeds the maximum of 10485760 bytes"
        '504':
          description: |
            A server-side wall-clock budget was exceeded — either the whole request
            (`request_timeout`, `server.request_timeout_secs`) or a single aperture
            integration (`computation_budget_exceeded`,
            `performance.integration_budget_ms`). See `/api/v1/heatmap` for how the two
            budgets differ; the fan-out caveat applies here too, since one request
            integrates once per cell.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                request_timeout:
                  summary: Whole-request timeout (S2)
                  value:
                    error: "request_timeout"
                    message: "Request processing exceeded the configured timeout of 30000 ms"
                computation_budget_exceeded:
                  summary: Single integration over budget (S3)
                  value:
                    error: "computation_budget_exceeded"
                    message: "computation exceeded time budget in azimuthal_mode_field: 31000 ms > 30000 ms budget"
        '503':
          description: |
            Admission control (roadmap S4): the server is already running the maximum
            number of concurrent heavy requests (batch / heatmap / h3-heatmap), configured
            by `performance.max_concurrent_heavy_requests` and shared across those three
            endpoints. The request was rejected immediately (never queued), so a
            `Retry-After` header is included. Never returned when the limit is 0 (the
            default; admission control disabled).
          headers:
            Retry-After:
              description: Seconds to wait before retrying (performance.admission_retry_after_secs).
              schema:
                type: integer
              example: 5
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                service_overloaded:
                  summary: Heavy-request concurrency limit reached (S4)
                  value:
                    error: "service_overloaded"
                    message: "Server is at its concurrent heavy-request limit (8); retry after 5 s"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/antennas:
    get:
      tags:
        - antennas
      summary: List all available antennas
      description: Returns list of all loaded antenna configurations with basic metadata.
      operationId: listAntennas
      responses:
        '200':
          description: List of antennas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntennaListResponse'

  /api/v1/antennas/{id}:
    get:
      tags:
        - antennas
      summary: Get antenna details
      description: Returns detailed information about a specific antenna including feeds, calibration status, and physical parameters.
      operationId: getAntennaDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Antenna ID
          schema:
            type: string
          example: "antenna_1"
      responses:
        '200':
          description: Antenna details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AntennaDetailsResponse'
        '404':
          description: Antenna not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/antennas/{id}/feeds:
    get:
      tags:
        - antennas
      summary: List feeds for antenna
      description: Returns list of all feeds available for the specified antenna.
      operationId: listFeeds
      parameters:
        - name: id
          in: path
          required: true
          description: Antenna ID
          schema:
            type: string
          example: "antenna_1"
      responses:
        '200':
          description: List of feeds
          content:
            application/json:
              schema:
                type: object
                properties:
                  antenna_id:
                    type: string
                  feeds:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeedInfo'
        '404':
          description: Antenna not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/antennas/{id}/feeds/{feed_id}:
    get:
      tags:
        - antennas
      summary: Get feed details
      description: Returns detailed information about a specific feed.
      operationId: getFeedDetails
      parameters:
        - name: id
          in: path
          required: true
          description: Antenna ID
          schema:
            type: string
          example: "antenna_1"
        - name: feed_id
          in: path
          required: true
          description: Feed ID
          schema:
            type: string
          example: "x_band_feed"
      responses:
        '200':
          description: Feed details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedInfo'
        '404':
          description: Antenna or feed not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    CoordinateSystem:
      type: string
      enum:
        - ecef
        - geodetic
      description: |
        Explicit coordinate system tag for a Position3D.
        - `ecef`: Earth-Centered Earth-Fixed (x, y, z in meters)
        - `geodetic`: Geodetic (longitude degrees, latitude degrees, altitude meters)

    Position3D:
      type: object
      description: |
        3D position with automatic coordinate system detection:
        - ECEF if |x| or |y| or |z| > 6400 km (matches Earth's radius)
        - Geodetic otherwise (lon/lat degrees, alt meters)

        Set `coordinate_system` explicitly to override auto-detection. This is
        recommended for high-altitude geodetic positions (e.g. GEO orbit at
        ~35,786 km) where auto-detection may misclassify as ECEF.
      required:
        - x
        - y
        - z
      properties:
        x:
          type: number
          format: double
          description: ECEF X (meters) OR longitude (degrees)
        y:
          type: number
          format: double
          description: ECEF Y (meters) OR latitude (degrees)
        z:
          type: number
          format: double
          description: ECEF Z (meters) OR altitude (meters)
        coordinate_system:
          $ref: '#/components/schemas/CoordinateSystem'
          description: |
            Optional explicit coordinate system override. When absent, auto-detected
            by magnitude. Setting this prevents misclassification for ambiguous positions.

    GainRequest:
      type: object
      required:
        - antenna_id
        - feed_id
        - vehicle_position
        - reflector_boresight
        - feed_pointing_location
        - emitter_position
        - frequency_mhz
      properties:
        antenna_id:
          type: string
          description: Antenna identifier
        feed_id:
          type: string
          description: Feed identifier
        vehicle_position:
          $ref: '#/components/schemas/Position3D'
        reflector_boresight:
          $ref: '#/components/schemas/Position3D'
        feed_pointing_location:
          allOf:
            - $ref: '#/components/schemas/Position3D'
          description: >-
            Earth location the feed's beam is aimed at (NOT the feed's physical
            location on the antenna). Set equal to reflector_boresight for an
            unsteered/focused feed.
        emitter_position:
          $ref: '#/components/schemas/Position3D'
        frequency_mhz:
          type: number
          format: double
          minimum: 100
          maximum: 50000
        pointing_frequency_mhz:
          type: number
          format: double
          description: Optional pointing frequency for beam squint correction
        include_reference:
          type: boolean
          default: false
          description: Include reference gain and loss calculation
        vehicle_attitude:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: >
            Optional vehicle attitude as a unit quaternion [w, x, y, z] (body → ECEF).
            Body axes: body +Z = antenna boresight direction, body +X = azimuth-zero
            (E-clock zero) reference. When supplied, the antenna-frame X-axis is derived
            from body +X rotated into ECEF and projected perpendicular to boresight,
            giving a deterministic, calibration-consistent azimuth reference.
            When omitted, azimuth zero is derived from the Earth-Z / East cross-product
            heuristic (approximate and discontinuous near boresight parallel to Earth-Z).
            The quaternion must be normalised to unit length (norm within 1e-3 of 1.0).

    GainResponse:
      type: object
      required:
        - antenna_id
        - feed_id
        - gain_db
        - geometry
        - warnings
        - metadata
      properties:
        antenna_id:
          type: string
        feed_id:
          type: string
        gain_db:
          type: number
          format: double
        reference_gain_db:
          type: number
          format: double
          nullable: true
        loss_db:
          type: number
          format: double
          nullable: true
        geometry:
          $ref: '#/components/schemas/GeometryInfo'
        warnings:
          type: array
          description: >
            Human-readable warnings about result quality. Classes include:
            uncalibrated / partially-calibrated accuracy estimates,
            outside-calibrated-region extrapolation, correction surface not
            applied (out of coverage), degraded-accuracy large feed offsets
            (ray-trace stub), aperture-integration non-convergence, and the
            off-axis honesty warning — emitted when a query on an UNCALIBRATED
            antenna falls beyond ~3x the first-null angle (~1.6*lambda/D,
            beamwidth-relative): off-axis values on such antennas combine
            idealised physical optics with a statistical Ruze sidelobe floor
            as an incoherent power sum (a best-estimate median wide-angle level
            tracking measured earth-station statistics, NTIA 84-164 — not a
            precise per-antenna prediction) and must not be used in place of
            calibrated data for interference / off-axis-EIRP analysis; and the
            REAR-HEMISPHERE warning — emitted for ANY antenna (calibrated or
            not) when a query is more than 90 degrees off boresight: the
            aperture-integration model has no physical validity behind the
            reflector: on antennas served with uncorrected physics the returned
            value is the statistical sidelobe floor only (the physical-optics
            term is excluded there); on antennas with a correction surface it
            is a numerical extrapolation, not a prediction (real rear
            levels come from feed spillover, edge diffraction, and mesh
            leakage, none of which are modeled). Use measured data or a
            regulatory rear-lobe envelope for rear-hemisphere analysis.
          items:
            type: string
        metadata:
          $ref: '#/components/schemas/ComputationMetadata'
        calibration_status:
          $ref: '#/components/schemas/CalibrationStatusInfo'

    GeometryInfo:
      type: object
      properties:
        feed_offset_meters:
          type: object
          description: >
            Physical feed offset from the focal point in the antenna frame (meters).
            x and y are the lateral displacement of the feed from the optical axis;
            z is the axial displacement from the focal point (positive toward the
            reflector vertex). All three components are ~zero for an on-axis feed.
          properties:
            x:
              type: number
              description: Lateral displacement along antenna x-axis (meters)
            y:
              type: number
              description: Lateral displacement along antenna y-axis (meters)
            z:
              type: number
              description: Axial displacement from focal point (meters)
        emitter_azimuth_deg:
          type: number
        emitter_elevation_deg:
          type: number
        beam_squint_deg:
          type: number
          nullable: true

    ComputationMetadata:
      type: object
      properties:
        computation_time_ms:
          type: number
        coordinate_transform_ms:
          type: number
          nullable: true
        physics_model_ms:
          type: number
          nullable: true
        correction_surface_ms:
          type: number
          nullable: true
        extrapolated:
          type: boolean
        spillover_loss_db:
          type: number
          nullable: true
          description: >-
            Physical feed-spillover loss (dB, negative) folded into gain_db on the
            uncalibrated path. Null when not applied (antenna has a correction
            surface, which absorbs spillover empirically).

    CalibrationStatusInfo:
      type: object
      required:
        - status
        - accuracy_estimate_db
        - correction_applied
        - parameters_source
      properties:
        status:
          type: string
          enum:
            - fully_calibrated
            - partially_calibrated
            - uncalibrated
        accuracy_estimate_db:
          type: number
          description: Estimated absolute gain accuracy in dB
        loss_accuracy_estimate_db:
          type: number
          nullable: true
          description: Estimated loss accuracy (only for uncalibrated)
        coverage:
          $ref: '#/components/schemas/CoverageInfo'
        correction_applied:
          type: boolean
        parameters_source:
          type: string
          enum:
            - design_specifications
            - boresight_tuning
            - partial_tuning
            - full_grid_tuning

    CoverageInfo:
      type: object
      properties:
        azimuth_range_deg:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        elevation_range_deg:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        frequency_range_mhz:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        num_measurements:
          type: integer
        is_boresight_only:
          type: boolean

    BatchGainRequest:
      type: object
      required:
        - evaluations
      properties:
        evaluations:
          type: array
          items:
            $ref: '#/components/schemas/GainRequest'
          maxItems: 1000

    H3LinkBudgetRequest:
      type: object
      required:
        - antenna_id
        - feed_id
        - vehicle_position
        - reflector_boresight
        - feed_pointing_location
        - frequency_mhz
        - n_rings
      properties:
        antenna_id:
          type: string
          description: Antenna identifier
        feed_id:
          type: string
          description: Feed identifier (for multi-feed antennas)
        vehicle_position:
          $ref: '#/components/schemas/Position3D'
        reflector_boresight:
          $ref: '#/components/schemas/Position3D'
        feed_pointing_location:
          allOf:
            - $ref: '#/components/schemas/Position3D'
          description: >-
            Earth location the feed's beam is aimed at (NOT the feed's physical
            location on the antenna). Set equal to reflector_boresight for an
            unsteered/focused feed.
        frequency_mhz:
          type: number
          format: double
          minimum: 100
          maximum: 50000
          description: Operating frequency in MHz
        pointing_frequency_mhz:
          type: number
          format: double
          minimum: 100
          maximum: 50000
          nullable: true
          description: >-
            Optional pointing frequency for beam squint correction (MHz).
            When supplied, must lie in [100, 50000] MHz.
        n_rings:
          type: integer
          minimum: 0
          maximum: 10
          description: Number of H3 rings around the center cell
        h3_resolution:
          type: integer
          minimum: 0
          maximum: 15
          nullable: true
          description: H3 resolution (0-15, higher = finer). Derived from frequency when absent.
        temperature_k:
          type: number
          format: double
          exclusiveMinimum: true
          minimum: 0
          maximum: 10000
          nullable: true
          description: >-
            System noise temperature in Kelvin (used for G/T computation).
            When supplied, must be strictly greater than 0 and at most 10000 K.
        vehicle_attitude:
          type: array
          items:
            type: number
            format: double
          minItems: 4
          maxItems: 4
          description: >
            Optional vehicle attitude as a unit quaternion [w, x, y, z] (body → ECEF).
            Body axes: body +Z = antenna boresight direction, body +X = azimuth-zero
            (E-clock zero) reference. When supplied, the antenna-frame X-axis is derived
            from body +X rotated into ECEF and projected perpendicular to boresight,
            giving a deterministic, calibration-consistent azimuth reference.
            When omitted, azimuth zero is derived from the Earth-Z / East cross-product
            heuristic (approximate and discontinuous near boresight parallel to Earth-Z).
            The quaternion must be normalised to unit length (norm within 1e-3 of 1.0).

    H3CellResult:
      type: object
      description: Link budget for a single H3 cell.
      properties:
        cell_id:
          type: string
          description: H3 cell index (string representation)
        center_lon:
          type: number
          format: double
          description: Cell centre longitude in degrees
        center_lat:
          type: number
          format: double
          description: Cell centre latitude in degrees
        azimuth_deg:
          type: number
          format: double
          description: Azimuth to the cell centre in the antenna frame (degrees)
        elevation_deg:
          type: number
          format: double
          description: Elevation to the cell centre in the antenna frame (degrees)
        distance_km:
          type: number
          format: double
          description: Distance from the vehicle to the cell centre in km
        gain_db:
          type: number
          format: double
          description: Antenna gain toward the cell centre in dB
        loss_db:
          type: number
          format: double
          description: >-
            Gain relative to the GRID PEAK, as `metadata.peak_gain_db - gain_db`, where
            peak_gain_db is the highest gain over the cells actually evaluated. Always >= 0,
            and exactly 0 at the peak cell. This is the same rule /api/v1/heatmap applies,
            so the field means one thing on both heatmap endpoints. The reference is one of
            the cells, so both sides of the subtraction share a basis by construction; a
            grid can still straddle two bases where it leaves calibration coverage
            (in-coverage cells corrected, out-of-coverage cells physics-only), as on
            /api/v1/heatmap. The peak of the grid need not be the peak of the beam: a grid
            that does not contain the beam peak understates loss for every cell in it.
        free_space_path_loss_db:
          type: number
          format: double
          description: Free-space path loss in dB, 20*log10(4*pi*d*f/c)
        total_path_loss_db:
          type: number
          format: double
          description: >-
            free_space_path_loss_db + loss_db. Since loss_db is referenced to the grid peak
            it is never negative, so this never falls below free_space_path_loss_db.
        g_over_t_db:
          type: number
          format: double
          nullable: true
          description: >-
            gain_db - 10*log10(temperature_k), in dB/K. Present only when the request
            supplied temperature_k; the temperature is a passthrough, not modelled.

    H3LinkBudgetResponse:
      type: object
      properties:
        antenna_id:
          type: string
          description: Antenna identifier
        feed_id:
          type: string
          description: Feed identifier
        frequency_mhz:
          type: number
          format: double
          description: Operating frequency in MHz
        center_cell_id:
          type: string
          description: H3 cell index of the center cell (string representation)
        h3_resolution:
          type: integer
          description: >-
            H3 resolution actually used — the request's h3_resolution when supplied,
            otherwise the value derived from frequency_mhz.
        cells:
          type: array
          description: >-
            Per-cell results, 1 + 3*n_rings*(n_rings + 1) of them.
          items:
            $ref: '#/components/schemas/H3CellResult'
        warnings:
          type: array
          description: >
            Aggregated, deduplicated warnings across all cells (e.g.,
            extrapolated cells, out-of-range queries, the off-axis honesty
            warning for uncalibrated antennas when cells fall beyond ~3x the
            first-null angle ~1.6*lambda/D — values there combine idealised
            physical optics with a statistical Ruze sidelobe floor as an
            incoherent power sum (best-estimate median, not a precise
            per-antenna prediction) — the rear-hemisphere warning for ANY
            antenna when cells fall more than
            90 degrees off boresight, where the aperture-integration model has
            no physical validity (on antennas served with uncorrected physics
            the returned value there is the statistical sidelobe floor only;
            on antennas with a correction surface it remains a numerical
            extrapolation), and the degraded-accuracy warning for large feed
            offsets (> 0.5*f, routed through the acknowledged ray-tracing stub;
            real ray tracing is gated as feature F2)).
          items:
            type: string
        metadata:
          type: object
          description: Computation metadata
          properties:
            points_evaluated:
              type: integer
            computation_time_ms:
              type: number
              format: double
            peak_gain_db:
              type: number
              format: double
              description: >-
                Highest gain in dB over the cells that evaluated successfully — the
                reference every loss_db in this response is measured against. When no cell
                evaluated successfully there is no peak and the sentinel -999999.0 is
                reported (never null); failed_points then equals points_evaluated.
            failed_points:
              type: integer
        calibration_status:
          $ref: '#/components/schemas/CalibrationStatusInfo'
        beam_squint_deg:
          type: number
          format: double
          nullable: true
          description: >-
            Beam squint magnitude applied (degrees), present only when the request's
            pointing_frequency_mhz differs from the operating frequency. Omitted when no
            squint is applied.

    BatchGainResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/GainResponse'
        metadata:
          type: object
          properties:
            total_computation_time_ms:
              type: number
            count:
              type: integer
            successful:
              type: integer
            failed:
              type: integer

    HeatmapRequest:
      type: object
      required:
        - antenna_id
        - feed_id
        - vehicle_position
        - reflector_boresight
        - feed_pointing_location
        - frequency_mhz
        - grid_config
      properties:
        antenna_id:
          type: string
        feed_id:
          type: string
        vehicle_position:
          $ref: '#/components/schemas/Position3D'
        reflector_boresight:
          $ref: '#/components/schemas/Position3D'
        feed_pointing_location:
          allOf:
            - $ref: '#/components/schemas/Position3D'
          description: >-
            Earth location the feed's beam is aimed at (NOT the feed's physical
            location on the antenna). Set equal to reflector_boresight for an
            unsteered/focused feed.
        frequency_mhz:
          type: number
        pointing_frequency_mhz:
          type: number
          nullable: true
        grid_config:
          $ref: '#/components/schemas/GridConfig'

    GridConfig:
      type: object
      required:
        - grid_type
      properties:
        grid_type:
          type: string
          enum:
            - rectangular
            - h3
        azimuth_range_deg:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            step:
              type: number
        elevation_range_deg:
          type: object
          properties:
            min:
              type: number
            max:
              type: number
            step:
              type: number
        h3_resolution:
          type: integer
          nullable: true
        center_azimuth_deg:
          type: number
          nullable: true
        center_elevation_deg:
          type: number
          nullable: true
        field_of_view_deg:
          type: number
          nullable: true

    HeatmapResponse:
      type: object
      properties:
        antenna_id:
          type: string
        feed_id:
          type: string
        frequency_mhz:
          type: number
        grid:
          $ref: '#/components/schemas/GridData'
        warnings:
          type: array
          description: >
            Aggregated, deduplicated warnings across all grid points (e.g.,
            extrapolated points, the off-axis honesty warning for
            uncalibrated antennas when grid points fall beyond ~3x the
            first-null angle ~1.6*lambda/D — values there combine idealised
            physical optics with a statistical Ruze sidelobe floor as an
            incoherent power sum (best-estimate median, not a precise
            per-antenna prediction) — the rear-hemisphere warning for ANY
            antenna when grid points fall more
            than 90 degrees off boresight, where the aperture-integration
            model has no physical validity (on antennas served with
            uncorrected physics the returned value there is the statistical
            sidelobe floor only; on antennas with a correction surface it
            remains a numerical extrapolation), and the degraded-accuracy
            warning for large feed offsets (> 0.5*f, routed through the
            acknowledged ray-tracing stub; real ray tracing is gated as
            feature F2)).
          items:
            type: string
        metadata:
          type: object
          properties:
            points_evaluated:
              type: integer
            computation_time_ms:
              type: number
            peak_gain_db:
              type: number
              description: >-
                Highest gain in dB over the grid points that evaluated successfully — the
                reference every loss_db in this response is measured against. When no point
                evaluated successfully there is no peak and the sentinel -999999.0 is
                reported (never null).
        calibration_status:
          $ref: '#/components/schemas/CalibrationStatusInfo'

    GridData:
      type: object
      properties:
        grid_type:
          type: string
        azimuth_values:
          type: array
          items:
            type: number
        elevation_values:
          type: array
          items:
            type: number
        loss_db:
          type: array
          description: 2D array of loss values [elevation][azimuth]
          items:
            type: array
            items:
              type: number

    AntennaListResponse:
      type: object
      properties:
        antennas:
          type: array
          items:
            $ref: '#/components/schemas/AntennaInfo'

    AntennaInfo:
      type: object
      properties:
        antenna_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        feed_count:
          type: integer
        feeds:
          type: array
          items:
            type: string

    AntennaDetailsResponse:
      type: object
      properties:
        antenna_id:
          type: string
        name:
          type: string
        calibration_status:
          type: string
        feeds:
          type: array
          items:
            $ref: '#/components/schemas/FeedInfo'
        physical_parameters:
          $ref: '#/components/schemas/PhysicalParametersInfo'
        validity_ranges:
          $ref: '#/components/schemas/ValidityRangesInfo'
        calibration_info:
          $ref: '#/components/schemas/CalibrationInfo'
        calibration_status_info:
          $ref: '#/components/schemas/CalibrationStatusInfo'
          nullable: true

    FeedInfo:
      type: object
      properties:
        feed_id:
          type: string
        name:
          type: string
        position:
          type: array
          items:
            type: number
          minItems: 3
          maxItems: 3
        q_factor:
          type: number
        phase_center_offset_m:
          type: number
        frequency_range:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2

    PhysicalParametersInfo:
      type: object
      properties:
        diameter_m:
          type: number
        f_over_d:
          type: number
        surface_rms_mm:
          type: number
        feed:
          type: object
          properties:
            q_factor:
              type: number
            phase_center_offset_m:
              type: number
        mesh:
          type: object
          nullable: true
          properties:
            mesh_spacing_mm:
              type: number
            wire_diameter_mm:
              type: number

    ValidityRangesInfo:
      type: object
      properties:
        azimuth:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        elevation:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        frequency:
          type: array
          items:
            type: number
          minItems: 2
          maxItems: 2
        temperature:
          type: number

    CalibrationInfo:
      type: object
      properties:
        calibration_date:
          type: string
        format_version:
          type: string
        data_source:
          type: string
        rmse_db:
          type: number
        num_measurements:
          type: integer
        parameters_tuned:
          type: boolean

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "healthy"

    StatusResponse:
      type: object
      properties:
        status:
          type: string
        uptime_seconds:
          type: number
        version:
          type: string
        antenna_count:
          type: integer
        antenna_ids:
          type: array
          items:
            type: string
        memory_usage_mb:
          type: number
          nullable: true

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: |
            Stable machine-readable error code. Always snake_case, and always one of the
            enumerated values — the service emits no other code. Defined once in code
            (`api/schemas.rs`, `mod error_codes`) and referenced by every emission site.

            Each code maps to exactly one status, uniformly across endpoints (roadmap
            C2): 400 = unparseable body, 422 = parsed but semantically invalid,
            404 = the named antenna or feed does not exist.
          enum:
            - antenna_not_found
            - feed_not_found
            - validation_error
            - invalid_coordinate
            - invalid_request_body
            - not_implemented
            - payload_too_large
            - request_timeout
            - computation_budget_exceeded
            - service_overloaded
            - internal_error
        message:
          type: string
          description: |
            Human-readable explanation. Not stable across releases — do not parse it.
        field:
          type: string
          description: |
            The request field that caused the error, when the service can attribute it to
            one. Omitted otherwise.
        details:
          type: string
          description: Additional context, when available. Omitted otherwise.
